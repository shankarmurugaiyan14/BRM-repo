apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
spec:
  type: {{ .Values.calculatorService.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.calculatorService.port }}
      targetPort: {{ .Values.calculatorService.targetPort }}
      nodePort: {{ .Values.calculatorService.nodePort }} kubec